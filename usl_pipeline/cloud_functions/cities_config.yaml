# H3 Admin Hex Pipeline Configuration
# Single consolidated config for all cities

output_dir: "output"
h3_col: "cell_code"

# All flood scenario columns (9 return periods)
value_cols:
  - "flood_depth_1y"
  - "flood_depth_5y"
  - "flood_depth_10y"
  - "flood_depth_25y"
  - "flood_depth_50y"
  - "flood_depth_100y"
  - "flood_depth_200y"
  - "flood_depth_500y"
  - "flood_depth_1000y"

# Filter threshold: Remove H3 cells where ALL flood values are below this threshold
# Removes sparse grid noise outside study area boundaries while keeping valid zeros
filter_threshold: 0.001

admin_boundaries:
  level_6: "counties.parquet"
  level_8: "places.parquet"
  level_10: "tracts.parquet"

# H3 resolutions: 6, 8, 10 (admin aggregation), 9-12 (hexagon tiles)
h3_hex_resolutions: [6, 7, 8, 9, 10, 11, 12]

# Scenario mapping: GCS folder name -> column name in merged CSV
# Order determines column order in output CSV
scenario_mapping:
  "Rainfall_Data_1.txt": "flood_depth_1y"
  "Rainfall_Data_2.txt": "flood_depth_5y"
  "Rainfall_Data_3.txt": "flood_depth_10y"
  "Rainfall_Data_4.txt": "flood_depth_25y"
  "Rainfall_Data_5.txt": "flood_depth_50y"
  "Rainfall_Data_6.txt": "flood_depth_100y"
  "Rainfall_Data_7.txt": "flood_depth_200y"
  "Rainfall_Data_8.txt": "flood_depth_500y"
  "Rainfall_Data_9.txt": "flood_depth_1000y"

# Active cities (currently processing)
cities:
  - name: NYC
    state_fips: "36"
    # NYC spans 5 counties (boroughs) — list all for admin boundary loading
    county_geoids:
      - "36061"   # Manhattan (New York County)
      - "36047"   # Brooklyn (Kings County)
      - "36081"   # Queens
      - "36005"   # Bronx
      - "36085"   # Staten Island (Richmond County)
    place_name: "New York city"
    h3_csv: "NYC_max.csv"    # generated by preprocessing
    predictions:
      bucket: "climateiq-predictions"
      city_folder: "NYC_Predictions"
      config_prefix: "NYC"
      mosaic_filename: "NYC_Predictions_mosaic_peak_wgs84.tif"

